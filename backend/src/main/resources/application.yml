spring:
  profiles:
    active: prod
  application:
    name: RecipAI
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: recipai
  flyway:
    enabled: true
    default-schema: recipai
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_API_KEY}
        chat:
          options:
            model: gemini-3-flash-preview
            thinking-level: low
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/recipai-751ae
  jackson:
    default-property-inclusion: non_null

recipai:
  s3:
    bucket-name: recipai-data
    region: eu-central-1
    presigned-url-expiration-minutes: 10
  meal-plan:
    max-owned-plans: 5