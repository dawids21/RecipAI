spring:
  profiles:
    active: prod
  application:
    name: RecipAI
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: recipai
  flyway:
    enabled: true
    default-schema: recipai
  ai:
    openai:
      api-key: ${SPRING_AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-2.5-flash
          reasoning-effort: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/recipai-751ae
